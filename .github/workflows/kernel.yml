name: Build Ginkgo Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Dependencies & GCC Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libelf-dev libssl-dev wget zip curl libncurses5-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Clang Toolchain
        run: |
          echo "Cleaning old toolchains..."
          rm -rf clang-toolchain

          echo "Cloning Clang Toolchain..."
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang-toolchain

      - name: Prepare Config & Patch Sources
        run: |
          if [ -f "arch/arm64/configs/vendor/ginkgo.config" ]; then
            cp arch/arm64/configs/vendor/ginkgo.config arch/arm64/configs/ginkgo_defconfig
          elif [ -f "arch/arm64/configs/ginkgo.config" ]; then
            cp arch/arm64/configs/ginkgo.config arch/arm64/configs/ginkgo_defconfig
          fi

          # Fix compat_uptr_t error for Clang build
          sed -i 's/compat_uptr_t/u32/g' include/linux/filter.h

          # Fix unsupported NR_CPUS for lb tracepoint error
          sed -i '/Unsupported NR_CPUS for lb tracepoint/s/^/\/\//' include/trace/events/sched.h

          # Fix bpf_stats_handler undeclared identifier error in kernel/sysctl.c
          sed -i 's/bpf_stats_handler/NULL/g' kernel/sysctl.c

          # Disable -Werror to prevent visibility and struct warnings from failing build
          sed -i 's/-Werror/-Wno-error/g' Makefile

      - name: Build Kernel
        run: |
          export PATH="$(pwd)/clang-toolchain/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          make O=out ginkgo_defconfig
          make O=out -j$(nproc) CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-Wno-error=visibility -Wno-error=incompatible-pointer-types"

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ginkgo-Kernel-Output
          path: out/arch/arm64/boot/Image.gz-dtb
