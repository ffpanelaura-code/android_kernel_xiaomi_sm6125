name: Build Ginkgo Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libelf-dev libssl-dev wget zip curl libncurses5-dev binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi clang llvm lld

      - name: Prepare Config
        run: |
          if [ -f "arch/arm64/configs/vendor/ginkgo.config" ]; then
            cp arch/arm64/configs/vendor/ginkgo.config arch/arm64/configs/ginkgo_defconfig
          elif [ -f "arch/arm64/configs/ginkgo.config" ]; then
            cp arch/arm64/configs/ginkgo.config arch/arm64/configs/ginkgo_defconfig
          fi

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          make O=out ginkgo_defconfig
          make O=out -j$(nproc) CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu-

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ginkgo-Kernel-Output
          path: out/arch/arm64/boot/Image.gz-dtb
