name: Build Ginkgo Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libelf-dev libssl-dev wget zip curl libncurses5-dev

      - name: Download Toolchains
        run: |
          echo "Downloading Clang 12..."
          wget -q https://github.com/chenxiaolong/Clang-12.0.1/archive/refs/heads/master.zip -O clang.zip
          unzip -q clang.zip
          mv Clang-12.0.1-master clang-toolchain

          echo "Downloading GCC 64-bit..."
          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-10.0.0_r47.tar.gz -O gcc-64.tar.gz
          mkdir gcc-64 && tar -xzf gcc-64.tar.gz -C gcc-64

          echo "Downloading GCC 32-bit..."
          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-10.0.0_r47.tar.gz -O gcc-32.tar.gz
          mkdir gcc-32 && tar -xzf gcc-32.tar.gz -C gcc-32

      - name: Prepare Config
        run: |
          if [ -f "arch/arm64/configs/vendor/ginkgo.config" ]; then
            cp arch/arm64/configs/vendor/ginkgo.config arch/arm64/configs/ginkgo_defconfig
          elif [ -f "arch/arm64/configs/ginkgo.config" ]; then
            cp arch/arm64/configs/ginkgo.config arch/arm64/configs/ginkgo_defconfig
          fi

      - name: Build Kernel
        run: |
          export PATH="$(pwd)/clang-toolchain/bin:$(pwd)/gcc-64/bin:$(pwd)/gcc-32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          
          make O=out ginkgo_defconfig
          make O=out -j$(nproc) CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android-

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ginkgo-Kernel-Output
          path: out/arch/arm64/boot/Image.gz-dtb
